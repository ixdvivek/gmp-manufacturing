<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <title>Preview — Global Reach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..900&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f2f2f2; }
    .gmp-font { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</helmet>

<!--
  Preview of the Global Reach band only, isolated from sector-detail.html /
  service-detail.html so the redesign can be reviewed before it goes back into
  both pages (they currently share this exact markup and style block).

  Changes from the shipped version:
   - The white caption card (bg-white, red top border, left-anchored) is gone.
   - Caption is vertical-centered on the band instead of pinned to the bottom.
   - Text is right-aligned and the column is narrowed so the sentence wraps to
     two lines instead of one long line / three short ones.
   - Left margin between the band's edge and the text column is widened —
     the text no longer starts flush against the gutter.
   - A left-to-right dark gradient replaces the white card as the contrast
     mechanism, since the text sits directly on the photo now. It is heaviest
     where the text sits and fades toward the right so the map itself stays
     readable.
-->
<div data-screen-label="Global Reach Preview" className="{{ s.page }}">
  <div className="{{ s.sectionPad }}">
    <div className="{{ s.mapOuter }}">
      <img src="assets/world-map.png" alt="World map showing GMP Manufacturing's global supply network" loading="lazy" className="{{ s.mapImg }}">
      <div className="{{ s.mapOverlay }}"></div>
      <div className="{{ s.mapCaptionWrap }}">
        <span className="{{ s.mapCaption }}">Supplying partners across 30+ countries from our own UK facilities.</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { bp: "desktop" };

  componentDidMount() {
    this._onResize = () => this._updateBp();
    window.addEventListener("resize", this._onResize);
    this._updateBp();
  }
  componentWillUnmount() {
    window.removeEventListener("resize", this._onResize);
  }
  _updateBp() {
    const w = window.innerWidth;
    const bp = w < 768 ? "mobile" : w < 1280 ? "tablet" : "desktop";
    if (bp !== this.state.bp) this.setState({ bp });
  }

  renderVals() {
    const isMobile = this.state.bp === "mobile";
    const isTablet = this.state.bp === "tablet";
    const isDesktop = this.state.bp === "desktop";
    const pick = (m, t, d) => (isMobile ? m : isTablet ? t : d);
    const gutter = pick(20, 40, 64);
    const s = {};

    s.page = "gmp-font min-h-screen w-full bg-[rgb(242,242,242)] flex flex-col items-center box-border py-[48px] md:py-[64px]";
    s.sectionPad = "relative z-[1] box-border px-[20px] md:px-[40px] xl:px-[64px] w-full max-w-[1600px]";

    // ---------- GLOBAL REACH (full-bleed map band, centered right-aligned caption) ----------
    s.mapOuter = `relative w-full overflow-hidden box-border ${pick("h-[320px]", "h-[400px]", "h-[480px]")}`;
    s.mapImg = "absolute inset-0 w-full h-full object-cover";
    // Fades left-to-right rather than a flat wash, so only the side carrying
    // the text is darkened and the map stays visible past it. The fade-out
    // point is set per breakpoint from how much of the band width the text
    // column actually occupies at that size (checked directly, not guessed):
    // ~91% on mobile, ~61% on tablet, ~45% on desktop — each stop pushed
    // comfortably past that so the last word never sits on bare image.
    s.mapOverlay = "absolute inset-0 pointer-events-none bg-[linear-gradient(to_right," + pick(
      "rgba(17,17,17,0.58)_0%,rgba(17,17,17,0.4)_55%,rgba(17,17,17,0)_97%",
      "rgba(17,17,17,0.5)_0%,rgba(17,17,17,0.3)_38%,rgba(17,17,17,0)_80%",
      "rgba(17,17,17,0.45)_0%,rgba(17,17,17,0.25)_30%,rgba(17,17,17,0)_65%"
    ) + ")]";
    // Widths below are the narrowest that still hold the sentence to exactly
    // two lines at each breakpoint's font size — checked in a real browser
    // rather than guessed, since line count depends on the actual font
    // metrics. Going narrower drops to three lines; wider collapses to one.
    s.mapCaptionWrap = "absolute inset-y-0 left-0 flex flex-col justify-center items-end box-border " +
      pick("w-[320px] pl-[20px] pr-[20px]", "w-[500px] pl-[56px] pr-[24px]", "w-[596px] pl-[72px] pr-[24px]");
    // w-full is load-bearing: mapCaptionWrap uses items-end (align-items:
    // flex-end) so the column hugs its content width rather than stretching,
    // which otherwise leaves this span free to size to its own content and
    // never wrap at all, however narrow the wrapper is drawn.
    s.mapCaption = `w-full block font-semibold ${pick("text-[16px] leading-[24px]", "text-[24px] leading-[32px]", "text-[28px] leading-[36px]")} tracking-[-0.4px] text-white text-right`;

    return { s };
  }
}
</script>
</body>
</html>
