<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <script src="image-slot.js"></script>
</helmet>
<section style="font-family:'DM Sans',system-ui,sans-serif;width:100%;background:#FFFFFF;">
  <div style="position:relative;width:100%;height:calc(100vh - 88px);min-height:480px;overflow:hidden;background:#30265B;">
    <sc-if value="{{ bgImage }}" hint-placeholder-val="{{ true }}">
      <img src="{{ bgImage }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    </sc-if>
    <sc-if value="{{ useSlot }}">
      <image-slot id="{{ slotId }}" style="position:absolute;inset:0;width:100%;height:100%;" shape="rect" placeholder="Drop hero image"></image-slot>
    </sc-if>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(178,33,38,0.58) 0%,rgba(112,35,65,0.56) 38%,rgba(72,37,81,0.6) 65%,rgba(39,38,95,0.72) 100%);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,19,46,0.42) 0%,rgba(20,19,46,0.6) 100%);"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,64px) clamp(20px,3vw,44px);">
      <div style="width:100%;max-width:860px;text-align:center;display:flex;flex-direction:column;align-items:center;">
          <sc-if value="{{ label }}">
            <div style="font-size:13px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.9);margin-bottom:16px;">{{ label }}</div>
          </sc-if>
          <h1 style="margin:0;font-size:clamp(32px,6vw,56px);font-weight:600;line-height:1.08;letter-spacing:-0.01em;color:#FFFFFF;text-wrap:balance;">{{ headline }}</h1>
          <sc-if value="{{ subhead }}">
            <p style="margin:20px 0 0;font-size:clamp(15px,2.2vw,18px);font-weight:400;line-height:1.6;color:rgba(255,255,255,0.88);max-width:580px;">{{ subhead }}</p>
          </sc-if>
          <sc-if value="{{ showButtons }}">
            <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;justify-content:center;">
              <a href="{{ primaryHref }}" style="padding:14px 26px;font-size:15px;font-weight:500;color:#30265B;background:#FFFFFF;border-radius:8px;text-decoration:none;white-space:nowrap;" style-hover="background:#F7F6FB;">{{ primaryLabel }}</a>
              <sc-if value="{{ secondaryLabel }}">
                <a href="{{ secondaryHref }}" style="padding:14px 26px;font-size:15px;font-weight:500;color:#FFFFFF;background:transparent;border:1.5px solid rgba(255,255,255,0.85);border-radius:8px;text-decoration:none;white-space:nowrap;" style-hover="background:rgba(255,255,255,0.12);">{{ secondaryLabel }}</a>
              </sc-if>
            </div>
          </sc-if>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:700},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bgImage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ISO Certified CDMO \u00b7 Hull, UK&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Complete CDMO solutions, from molecule to market.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subhead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Development, manufacturing and packaging under one ISO-certified roof.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Get a quote&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GetInTouch.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Explore services&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Services.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      slotId: p.slotId || 'hero',
      bgImage: p.bgImage || '',
      useSlot: !p.bgImage,
      label: p.label || '',
      headline: p.headline || '',
      subhead: p.subhead || '',
      primaryLabel: p.primaryLabel || '',
      primaryHref: p.primaryHref || '#',
      secondaryLabel: p.secondaryLabel || '',
      secondaryHref: p.secondaryHref || '#',
      showButtons: !!(p.primaryLabel)
    };
  }
}
</script>
</body>
</html>
