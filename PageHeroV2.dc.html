<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
  <script src="image-slot.js"></script>
</helmet>
<section style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;width:100%;background:#FFFFFF;">
  <div style="position:relative;width:100%;height:calc(100vh - 88px);min-height:480px;overflow:hidden;background:#30265B;">
    <sc-if value="{{ bgImage }}" hint-placeholder-val="{{ true }}">
      <img src="{{ bgImage }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    </sc-if>
    <sc-if value="{{ useSlot }}">
      <image-slot id="{{ slotId }}" style="position:absolute;inset:0;width:100%;height:100%;" shape="rect" placeholder="Drop hero image"></image-slot>
    </sc-if>
    <div style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(39,38,95,0.82) 0%,rgba(72,37,81,0.5) 52%,rgba(178,33,38,0.32) 100%);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(20,19,46,0.55) 0%,transparent 55%);"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,72px) clamp(20px,5vw,80px);">
      <div style="width: 100%; max-width: 780px; display: flex; flex-direction: column; align-items: center; text-align: center; align-self: auto; justify-content: space-around; position: static">
          <sc-if value="{{ label }}">
            <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,0.14);border-radius:999px;font-size:13px;font-weight:600;letter-spacing:0.02em;color:#FFFFFF;margin-bottom:24px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">
              <span style="display:block;width:7px;height:7px;border-radius:50%;background:#FF6B6F;"></span>{{ label }}
            </div>
          </sc-if>
          <h1 style="margin:0;font-size:clamp(34px,6vw,60px);font-weight:700;line-height:1.05;letter-spacing:-0.025em;color:#FFFFFF;text-wrap:balance;">{{ headline }}</h1>
          <sc-if value="{{ subhead }}">
            <p style="margin:22px 0 0;font-size:clamp(15px,2.2vw,19px);font-weight:400;line-height:1.6;color:rgba(255,255,255,0.9);max-width:560px;">{{ subhead }}</p>
          </sc-if>
          <sc-if value="{{ showButtons }}">
            <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:36px;">
              <a href="{{ primaryHref }}" style="display:inline-flex;align-items:center;gap:9px;padding:16px 30px;font-size:15px;font-weight:600;color:#FFFFFF;background:#B22126;border-radius:999px;text-decoration:none;white-space:nowrap;box-shadow:0 10px 28px rgba(178,33,38,0.4);transition:transform .2s,box-shadow .2s;" style-hover="transform:translateY(-2px);box-shadow:0 14px 34px rgba(178,33,38,0.5);">{{ primaryLabel }}<span style="font-size:17px;line-height:1;">→</span></a>
              <sc-if value="{{ secondaryLabel }}">
                <a href="{{ secondaryHref }}" style="display:inline-flex;align-items:center;padding:16px 30px;font-size:15px;font-weight:600;color:#30265B;background:#FFFFFF;border-radius:999px;text-decoration:none;white-space:nowrap;transition:transform .2s;" style-hover="transform:translateY(-2px);">{{ secondaryLabel }}</a>
              </sc-if>
            </div>
          </sc-if>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:700},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bgImage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ISO Certified CDMO · Hull, UK&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Complete CDMO solutions, from molecule to market.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subhead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Development, manufacturing and packaging under one ISO-certified roof.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Get a quote&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GetInTouch.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Explore services&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Services.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      slotId: p.slotId || 'hero',
      bgImage: p.bgImage || '',
      useSlot: !p.bgImage,
      label: p.label || '',
      headline: p.headline || '',
      subhead: p.subhead || '',
      primaryLabel: p.primaryLabel || '',
      primaryHref: p.primaryHref || '#',
      secondaryLabel: p.secondaryLabel || '',
      secondaryHref: p.secondaryHref || '#',
      showButtons: !!(p.primaryLabel)
    };
  }
}
</script>
</body>
</html>
