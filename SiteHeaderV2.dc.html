<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:2000;background:rgba(255,255,255,0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(39,38,95,0.06),0 6px 24px rgba(39,38,95,0.05);font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,3vw,44px);height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <a href="HomeV2.dc.html" style="display:flex;align-items:center;flex-shrink:0;text-decoration:none;">
      <img src="./gmp-manufacturing-ltd-logo-mqumlkiq.png" alt="GMP Manufacturing" style="height:60px;width:auto;display:block;">
    </a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:4px;background:#F4F2FA;padding:6px;border-radius:999px;">
        <a href="HomeV2.dc.html" style="padding:11px 18px;font-size:14px;font-weight:{{ wHome }};color:{{ cHome }};background:{{ bgHome }};border-radius:999px;text-decoration:none;transition:background .2s,color .2s;" style-hover="color:#30265B;">Home</a>
        <a href="AboutUs.dc.html" style="padding:11px 18px;font-size:14px;font-weight:{{ wAbout }};color:{{ cAbout }};background:{{ bgAbout }};border-radius:999px;text-decoration:none;transition:background .2s,color .2s;" style-hover="color:#30265B;">About Us</a>

        <div style="position:relative;" onMouseEnter="{{ openServices }}" onMouseLeave="{{ closeMenu }}">
          <a href="Services.dc.html" style="display:inline-flex;align-items:center;gap:6px;padding:11px 18px;font-size:14px;font-weight:{{ wServices }};color:{{ cServices }};background:{{ bgServices }};border-radius:999px;text-decoration:none;transition:background .2s,color .2s;" style-hover="color:#30265B;">Services<span style="font-size:9px;opacity:0.55;">▼</span></a>
          <sc-if value="{{ servicesOpen }}">
            <div style="position:absolute;top:100%;left:0;padding-top:12px;z-index:50;">
              <div style="background:#FFFFFF;border-radius:18px;box-shadow:0 16px 44px rgba(39,38,95,0.16);padding:10px;min-width:308px;display:flex;flex-direction:column;gap:2px;">
                <sc-for list="{{ services }}" as="item" hint-placeholder-count="7">
                  <a href="{{ item.href }}" style="padding:11px 16px;font-size:14px;font-weight:500;color:#1C1B3A;text-decoration:none;border-radius:12px;line-height:1.3;" style-hover="background:#F4F2FA;color:#B22126;">{{ item.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>

        <div style="position:relative;" onMouseEnter="{{ openInnovation }}" onMouseLeave="{{ closeMenu }}">
          <a href="Innovation.dc.html" style="display:inline-flex;align-items:center;gap:6px;padding:11px 18px;font-size:14px;font-weight:{{ wInnovation }};color:{{ cInnovation }};background:{{ bgInnovation }};border-radius:999px;text-decoration:none;transition:background .2s,color .2s;" style-hover="color:#30265B;">Innovation<span style="font-size:9px;opacity:0.55;">▼</span></a>
          <sc-if value="{{ innovationOpen }}">
            <div style="position:absolute;top:100%;left:0;padding-top:12px;z-index:50;">
              <div style="background:#FFFFFF;border-radius:18px;box-shadow:0 16px 44px rgba(39,38,95,0.16);padding:10px;min-width:208px;display:flex;flex-direction:column;gap:2px;">
                <sc-for list="{{ innovation }}" as="item" hint-placeholder-count="2">
                  <a href="{{ item.href }}" style="padding:11px 16px;font-size:14px;font-weight:500;color:#1C1B3A;text-decoration:none;border-radius:12px;" style-hover="background:#F4F2FA;color:#B22126;">{{ item.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>

        <div style="position:relative;" onMouseEnter="{{ openSectors }}" onMouseLeave="{{ closeMenu }}">
          <a href="Sectors.dc.html" style="display:inline-flex;align-items:center;gap:6px;padding:11px 18px;font-size:14px;font-weight:{{ wSectors }};color:{{ cSectors }};background:{{ bgSectors }};border-radius:999px;text-decoration:none;transition:background .2s,color .2s;" style-hover="color:#30265B;">Sectors<span style="font-size:9px;opacity:0.55;">▼</span></a>
          <sc-if value="{{ sectorsOpen }}">
            <div style="position:absolute;top:100%;left:0;padding-top:12px;z-index:50;">
              <div style="background:#FFFFFF;border-radius:18px;box-shadow:0 16px 44px rgba(39,38,95,0.16);padding:10px;min-width:228px;display:flex;flex-direction:column;gap:2px;">
                <sc-for list="{{ sectors }}" as="item" hint-placeholder-count="7">
                  <a href="{{ item.href }}" style="padding:11px 16px;font-size:14px;font-weight:500;color:#1C1B3A;text-decoration:none;border-radius:12px;" style-hover="background:#F4F2FA;color:#B22126;">{{ item.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </nav>

      <a href="GetInTouch.dc.html" style="flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:13px 24px;font-size:14px;font-weight:600;color:#FFFFFF;background:#30265B;border-radius:999px;text-decoration:none;white-space:nowrap;box-shadow:0 6px 18px rgba(39,38,95,0.25);transition:transform .2s,box-shadow .2s;" style-hover="transform:translateY(-1px);box-shadow:0 10px 24px rgba(39,38,95,0.32);">Get in Touch<span style="font-size:15px;line-height:1;">→</span></a>
    </sc-if>

    <sc-if value="{{ isMobile }}">
      <button onClick="{{ toggleMobile }}" aria-label="Menu" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:46px;height:46px;background:#F4F2FA;border:none;border-radius:999px;cursor:pointer;align-items:center;">
        <span style="display:block;width:20px;height:2px;border-radius:2px;background:#30265B;"></span>
        <span style="display:block;width:20px;height:2px;border-radius:2px;background:#30265B;"></span>
        <span style="display:block;width:20px;height:2px;border-radius:2px;background:#30265B;"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ mobileOpen }}">
    <div style="background:#FFFFFF;box-shadow:0 12px 32px rgba(39,38,95,0.12);max-height:calc(100vh - 88px);overflow-y:auto;padding:12px 16px 24px;">
      <a href="HomeV2.dc.html" style="display:block;padding:14px 12px;font-size:16px;font-weight:600;color:#1C1B3A;text-decoration:none;border-radius:12px;" style-hover="background:#F4F2FA;">Home</a>
      <a href="AboutUs.dc.html" style="display:block;padding:14px 12px;font-size:16px;font-weight:600;color:#1C1B3A;text-decoration:none;border-radius:12px;" style-hover="background:#F4F2FA;">About Us</a>

      <button onClick="{{ tServices }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 12px;font-family:inherit;font-size:16px;font-weight:600;color:#1C1B3A;background:transparent;border:none;border-radius:12px;cursor:pointer;text-align:left;">Services<span style="font-size:14px;color:#9D99B3;">{{ mServicesCaret }}</span></button>
      <sc-if value="{{ mServicesOpen }}">
        <div style="display:flex;flex-direction:column;padding:2px 0 10px 8px;">
          <sc-for list="{{ services }}" as="item" hint-placeholder-count="7">
            <a href="{{ item.href }}" style="padding:11px 14px;font-size:15px;color:#6A6486;text-decoration:none;border-radius:10px;" style-hover="background:#F4F2FA;">{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-if>

      <button onClick="{{ tInnovation }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 12px;font-family:inherit;font-size:16px;font-weight:600;color:#1C1B3A;background:transparent;border:none;border-radius:12px;cursor:pointer;text-align:left;">Innovation<span style="font-size:14px;color:#9D99B3;">{{ mInnovationCaret }}</span></button>
      <sc-if value="{{ mInnovationOpen }}">
        <div style="display:flex;flex-direction:column;padding:2px 0 10px 8px;">
          <sc-for list="{{ innovation }}" as="item" hint-placeholder-count="2">
            <a href="{{ item.href }}" style="padding:11px 14px;font-size:15px;color:#6A6486;text-decoration:none;border-radius:10px;" style-hover="background:#F4F2FA;">{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-if>

      <button onClick="{{ tSectors }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 12px;font-family:inherit;font-size:16px;font-weight:600;color:#1C1B3A;background:transparent;border:none;border-radius:12px;cursor:pointer;text-align:left;">Sectors<span style="font-size:14px;color:#9D99B3;">{{ mSectorsCaret }}</span></button>
      <sc-if value="{{ mSectorsOpen }}">
        <div style="display:flex;flex-direction:column;padding:2px 0 10px 8px;">
          <sc-for list="{{ sectors }}" as="item" hint-placeholder-count="7">
            <a href="{{ item.href }}" style="padding:11px 14px;font-size:15px;color:#6A6486;text-decoration:none;border-radius:10px;" style-hover="background:#F4F2FA;">{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-if>

      <a href="GetInTouch.dc.html" style="display:block;margin-top:18px;padding:15px;font-size:16px;font-weight:600;color:#FFFFFF;background:#30265B;border-radius:999px;text-decoration:none;text-align:center;">Get in Touch</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;innovation&quot;,&quot;sectors&quot;,&quot;&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isDesktop: true, openMenu: null, mobileOpen: false, mobileSection: null };

  componentDidMount() {
    this.mq = window.matchMedia('(min-width:768px)');
    this.apply = () => this.setState({ isDesktop: this.mq.matches, openMenu: null, mobileOpen: false, mobileSection: null });
    this.apply();
    if (this.mq.addEventListener) this.mq.addEventListener('change', this.apply);
    else this.mq.addListener(this.apply);
  }
  componentWillUnmount() {
    if (!this.mq) return;
    if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.apply);
    else this.mq.removeListener(this.apply);
  }

  renderVals() {
    const active = this.props.active || '';
    const services = [
      { label: 'Manufacturing, Filling & Packing', href: 'Services.dc.html' },
      { label: 'QC, Micro & Stability', href: 'Services.dc.html' },
      { label: 'Technology Transfer', href: 'Services.dc.html' },
      { label: 'Product Development & Remediation', href: 'Services.dc.html' },
      { label: 'QP, RP, RP-I & Regulatory Support', href: 'Services.dc.html' },
      { label: 'Co-Packing & Contract Manufacturing', href: 'Services.dc.html' },
      { label: 'Research & Development', href: 'Services.dc.html' }
    ];
    const innovation = [
      { label: '3D Printing', href: '3DPrinting.dc.html' },
      { label: 'Space Age', href: 'SpaceAge.dc.html' }
    ];
    const sectors = [
      { label: 'Pharmaceutical', href: 'Sectors.dc.html' },
      { label: 'Veterinary', href: 'Sectors.dc.html' },
      { label: 'Medical Device', href: 'Sectors.dc.html' },
      { label: 'Cosmetic', href: 'Sectors.dc.html' },
      { label: 'Supplements', href: 'Sectors.dc.html' },
      { label: 'Biocide', href: 'Sectors.dc.html' },
      { label: 'Other', href: 'Sectors.dc.html' }
    ];
    const open = this.state.openMenu;
    const sec = this.state.mobileSection;
    const act = (k) => active === k;
    return {
      isDesktop: this.state.isDesktop,
      isMobile: !this.state.isDesktop,
      mobileOpen: this.state.mobileOpen,
      services, innovation, sectors,
      servicesOpen: open === 'services',
      innovationOpen: open === 'innovation',
      sectorsOpen: open === 'sectors',
      wHome: act('home') ? 700 : 500,
      wAbout: act('about') ? 700 : 500,
      wServices: act('services') ? 700 : 500,
      wInnovation: act('innovation') ? 700 : 500,
      wSectors: act('sectors') ? 700 : 500,
      cHome: act('home') ? '#30265B' : '#5A5577',
      cAbout: act('about') ? '#30265B' : '#5A5577',
      cServices: act('services') ? '#30265B' : '#5A5577',
      cInnovation: act('innovation') ? '#30265B' : '#5A5577',
      cSectors: act('sectors') ? '#30265B' : '#5A5577',
      bgHome: act('home') ? '#FFFFFF' : 'transparent',
      bgAbout: act('about') ? '#FFFFFF' : 'transparent',
      bgServices: act('services') ? '#FFFFFF' : 'transparent',
      bgInnovation: act('innovation') ? '#FFFFFF' : 'transparent',
      bgSectors: act('sectors') ? '#FFFFFF' : 'transparent',
      mServicesOpen: sec === 'services',
      mInnovationOpen: sec === 'innovation',
      mSectorsOpen: sec === 'sectors',
      mServicesCaret: sec === 'services' ? '\u2212' : '+',
      mInnovationCaret: sec === 'innovation' ? '\u2212' : '+',
      mSectorsCaret: sec === 'sectors' ? '\u2212' : '+',
      openServices: () => this.setState({ openMenu: 'services' }),
      openInnovation: () => this.setState({ openMenu: 'innovation' }),
      openSectors: () => this.setState({ openMenu: 'sectors' }),
      closeMenu: () => this.setState({ openMenu: null }),
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen, mobileSection: null })),
      tServices: () => this.setState(s => ({ mobileSection: s.mobileSection === 'services' ? null : 'services' })),
      tInnovation: () => this.setState(s => ({ mobileSection: s.mobileSection === 'innovation' ? null : 'innovation' })),
      tSectors: () => this.setState(s => ({ mobileSection: s.mobileSection === 'sectors' ? null : 'sectors' }))
    };
  }
}
</script>
</body>
</html>
