<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</helmet>
<section style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:0 16px;">
  <div style="position:relative;max-width:1320px;margin:0 auto;border-radius:32px;overflow:hidden;background:linear-gradient(125deg,#30265B 0%,#482551 52%,#B22126 120%);padding:clamp(52px,8vw,84px) 24px;text-align:center;">
    <div style="position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,0.14) 1.5px, transparent 1.6px);background-size:22px 22px;mask-image:radial-gradient(ellipse at 70% 30%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 0%,transparent 70%);"></div>
    <div style="position:relative;">
    <h2 style="margin:0 auto;max-width:700px;font-size:clamp(26px,4.4vw,38px);font-weight:700;line-height:1.12;letter-spacing:-0.02em;color:#FFFFFF;text-wrap:balance;">{{ headline }}</h2>
    <sc-if value="{{ subline }}">
      <p style="margin:18px auto 0;max-width:560px;font-size:clamp(15px,2.2vw,17px);line-height:1.6;color:rgba(255,255,255,0.85);">{{ subline }}</p>
    </sc-if>
    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px;">
      <a href="{{ btn1Href }}" style="display:inline-flex;align-items:center;gap:9px;padding:16px 30px;font-size:15px;font-weight:600;color:#30265B;background:#FFFFFF;border-radius:999px;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,0.18);transition:transform .2s;" style-hover="transform:translateY(-2px);">{{ btn1Label }}<span style="font-size:17px;line-height:1;">&rarr;</span></a>
      <sc-if value="{{ btn2Label }}">
        <a href="{{ btn2Href }}" style="display:inline-flex;align-items:center;padding:16px 30px;font-size:15px;font-weight:600;color:#FFFFFF;background:rgba(255,255,255,0.16);border-radius:999px;text-decoration:none;transition:background .2s;" style-hover="background:rgba(255,255,255,0.26);">{{ btn2Label }}</a>
      </sc-if>
    </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:300},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Let’s build your next product together.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Talk to our team about your development, manufacturing or packaging needs.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btn1Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Get a quote&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btn1Href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GetInTouch.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btn2Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contact us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btn2Href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GetInTouch.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      headline: p.headline || 'Let\u2019s build your next product together.',
      subline: p.subline || '',
      btn1Label: p.btn1Label || 'Get a quote',
      btn1Href: p.btn1Href || 'GetInTouch.dc.html',
      btn2Label: p.btn2Label || '',
      btn2Href: p.btn2Href || 'GetInTouch.dc.html'
    };
  }
}
</script>
</body>
</html>
