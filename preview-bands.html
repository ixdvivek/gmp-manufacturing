<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <title>Preview — Full-bleed bands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..900&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f2f2f2; }
    .gmp-font { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</helmet>

<!--
  Both full-bleed bands in isolation, for reviewing them side by side without
  scrolling a whole detail page.

  The styles below are copied verbatim from sector-detail.html /
  service-detail.html, where this is already live — this file exists only to
  view them, not as a separate implementation. If the two ever disagree, the
  detail pages are the source of truth.

  The bands are reproduced inside the same full-bleed context they have on those
  pages: a gutter-padded wrapper, with the band pulled back out by the same
  gutter via -ml/-mr. An earlier version of this preview used a plain w-full
  band with no negative margins, which made the caption padding look correct
  here while the real pages rendered their text hard against the screen edge.
-->
<div data-screen-label="Bands Preview" className="{{ s.page }}">
  <div className="{{ s.stack }}">

    <div className="{{ s.bandOuterTall }}">
      <img src="assets2/about-real.jpg" alt="Inside GMP Manufacturing's UK facility" loading="lazy" className="{{ s.bandImg }}">
      <div className="{{ s.bandBar }}">
        <div className="{{ s.bandBarInner }}">
          <div className="{{ s.bandBarLeft }}">
            <span className="{{ s.bandEyebrow }}">UK Manufacturing</span>
            <span className="{{ s.bandHeading }}">Inside Our UK Manufacturing Facility</span>
          </div>
          <div className="{{ s.bandDivider }}"></div>
          <div className="{{ s.bandBodyWrap }}">
            <span className="{{ s.bandBody }}">From raw materials through to finished, market-ready products &mdash; all under one roof.</span>
          </div>
        </div>
      </div>
    </div>

    <div className="{{ s.bandOuterShort }}">
      <img src="assets/world-map.png" alt="World map showing GMP Manufacturing's global supply network" loading="lazy" className="{{ s.bandImg }}">
      <div className="{{ s.bandBar }}">
        <div className="{{ s.bandBarInner }}">
          <div className="{{ s.bandBarLeft }}">
            <span className="{{ s.bandEyebrow }}">Global Reach</span>
            <span className="{{ s.bandHeading }}">30+ Countries Worldwide</span>
          </div>
          <div className="{{ s.bandDivider }}"></div>
          <div className="{{ s.bandBodyWrap }}">
            <span className="{{ s.bandBody }}">Supplying partners across global markets from our UK facilities.</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { bp: "desktop" };

  componentDidMount() {
    this._onResize = () => this._updateBp();
    window.addEventListener("resize", this._onResize);
    this._updateBp();
  }
  componentWillUnmount() {
    window.removeEventListener("resize", this._onResize);
  }
  _updateBp() {
    const w = window.innerWidth;
    const bp = w < 768 ? "mobile" : w < 1280 ? "tablet" : "desktop";
    if (bp !== this.state.bp) this.setState({ bp });
  }

  renderVals() {
    const isMobile = this.state.bp === "mobile";
    const isTablet = this.state.bp === "tablet";
    const pick = (m, t, d) => (isMobile ? m : isTablet ? t : d);
    const s = {};

    const gutter = pick(20, 40, 64);

    s.page = "gmp-font min-h-screen w-full bg-[rgb(242,242,242)] box-border overflow-x-clip py-[40px] md:py-[56px]";
    // Mirrors the detail pages' section padding, so the negative margins below
    // have the same thing to push back against.
    s.stack = `flex flex-col gap-[40px] md:gap-[56px] w-full box-border px-[${gutter}px]`;

    // Heights match the two live sections: the facility insert is the taller
    // of the pair, the map band shorter. The -ml/-mr is what makes them
    // full-bleed, and is exactly what the caption padding has to compensate for.
    s.bandOuterTall = `relative w-auto -ml-[${gutter}px] -mr-[${gutter}px] overflow-hidden box-border ${pick("h-[380px]", "h-[460px]", "h-[560px]")}`;
    s.bandOuterShort = `relative w-auto -ml-[${gutter}px] -mr-[${gutter}px] overflow-hidden box-border ${pick("h-[320px]", "h-[400px]", "h-[480px]")}`;
    s.bandImg = "absolute inset-0 w-full h-full object-cover";

    // ---------- FULL-BLEED BAND CAPTION (shared) ----------
    // Verbatim from the detail pages.
    s.bandBar = "absolute left-0 right-0 bottom-0 box-border bg-[rgba(10,24,51,0.92)] " +
      pick("py-[20px] px-[40px]", "py-[24px] px-[80px]", "py-[28px] px-[128px]");
    s.bandBarInner = "w-full max-w-[1600px] mx-auto box-border flex " +
      (isMobile ? "flex-col gap-[12px]" : "flex-row items-stretch " + pick("", "gap-[28px]", "gap-[40px]"));
    s.bandBarLeft = "flex flex-col justify-center gap-[6px] " + (isMobile ? "w-full" : "w-[46%] shrink-0");
    s.bandEyebrow = `font-semibold ${pick("text-[12px]", "text-[12px]", "text-[13px]")} leading-[18px] tracking-[1.4px] uppercase text-[rgb(125,185,240)]`;
    s.bandHeading = `font-semibold ${pick("text-[22px]", "text-[26px]", "text-[30px]")} leading-[1.25] tracking-[-0.5px] text-white`;
    s.bandDivider = isMobile ? "hidden" : "w-px self-stretch shrink-0 bg-[rgba(255,255,255,0.22)]";
    s.bandBodyWrap = "flex items-center " + (isMobile ? "w-full" : "grow");
    s.bandBody = `font-normal ${pick("text-[15px]", "text-[15px]", "text-[16px]")} leading-[24px] text-[rgba(255,255,255,0.85)] max-w-[460px]`;

    return { s };
  }
}
</script>
</body>
</html>
